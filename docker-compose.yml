version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campusquery-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: campusquery-frontend
    ports:
      # Map the Nginx port 80 to the dev port 5173 on the host
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
